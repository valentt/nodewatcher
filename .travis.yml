dist: jammy
language: python
python:
 - "3.10"
env:
  global:
    - PYTHONPATH=.
    - DB_1_ENV_PGSQL_ROLE_1_USERNAME=postgres
    - DB_1_PORT_5432_TCP_ADDR=localhost
    - DB_1_PORT_5432_TCP_PORT=""
    - INFLUXDB_1_PORT_8086_TCP_ADDR=localhost
services:
 - docker
 - postgresql
addons:
  postgresql: "14"
  apt:
    packages:
     - postgresql-14-postgis-3
before_install:
 - docker run -d -p 8086:8086 -v /var/lib/influxdb influxdb:1.8
 - sudo apt-get update
 - cat packages.txt | grep -v postgresql- | grep -v libgeos-c1 | grep -v libgdal1i | sudo DEBIAN_FRONTEND=noninteractive xargs apt-get --no-install-recommends -y install || true
 - sudo DEBIAN_FRONTEND=noninteractive apt-get --no-install-recommends -y install libgdal-dev
install:
 - pip install flake8
 - pip install pylint
 - sed -i 's/^-r.*$//g' requirements.txt
 - cat requirements-readthedocs.txt requirements.txt | xargs -n 1 sh -c 'CPLUS_INCLUDE_PATH=/usr/include/gdal C_INCLUDE_PATH=/usr/include/gdal pip install $0 || exit 255'
before_script:
 - createdb nodewatcher
 - psql -U postgres -c "create extension postgis" nodewatcher
 - flake8 nodewatcher --ignore=E501,W503 || true
 - pylint nodewatcher || true
script:
 - python manage.py test --keepdb
